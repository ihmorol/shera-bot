name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref: a new push cancels the previous run instead of paying for it twice.
# Private-repository Actions minutes are metered, so every job below runs on
# ubuntu-latest only (the production target is Ubuntu 24.04).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: install → lint → typecheck → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # pnpm/action-setup installs the version declared by "packageManager" in
      # package.json — the single place the toolchain is pinned (with .nvmrc + engines).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  license-inventory:
    name: license inventory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm license:inventory
      # Uploaded even when the gate fails, so a rejected inventory is retrievable.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-inventory
          path: artifacts/license-inventory.json
          if-no-files-found: error

  mockup-regression:
    name: mockup regression suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      # The static mockup is reference evidence, not shipped code, but its suite is the
      # S01 regression budget and must never be broken by build tooling.
      - run: node --test mockup/dock-layout.test.cjs

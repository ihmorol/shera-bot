packages:
  - "apps/*"
  - "packages/*"
# esbuild's postinstall (used by drizzle-kit) must run; allow-listed per
# package (pnpm 12 build-approval). Only build scripts we have reviewed.
allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
minimumReleaseAgeExclude:
  - prettier@3.9.7
  - "@ai-sdk/anthropic@4.0.92"
  - "@ai-sdk/gateway@4.0.130"
  - "@ai-sdk/google@4.0.108"
  - "@ai-sdk/openai-compatible@3.0.81"
  - "@ai-sdk/openai@4.0.105"
  - "@ai-sdk/provider-utils@5.0.71"
  - ai@7.0.157

<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shera · 3D avatar</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>
body{margin:0;background:#f4eade;color:#554235;font:16px system-ui;text-align:center}
model-viewer{width:100%;height:72vh;min-height:340px}h1{margin:20px 0 4px;font-size:24px}
a{color:inherit}button{padding:10px 18px;border:1px solid #b59472;border-radius:24px;background:#fff8ec;cursor:pointer}
</style>
<h1>Shera</h1><p id="status">Loading the 3D model…</p>
<model-viewer src="shera-main-v2.glb?revision=4" alt="Orange and cream floating robot with a glowing happy eye" camera-controls autoplay shadow-intensity="0.35" shadow-softness="1" camera-orbit="-12deg 87deg 6.4m" exposure="1.3" environment-image="studio.hdr"></model-viewer>
<button data-view="-12deg 87deg 6.4m">Reference view</button> <button data-view="14deg 85deg 6.4m">Front</button> <button data-view="-90deg 85deg 6.4m">Side</button> <button data-view="180deg 85deg 6.4m">Back</button><br><br><button id="motion">Pause floating</button> · <a href="shera-main-v2.glb?revision=4" download>Download GLB</a>
<script>
const model=document.querySelector('model-viewer');
document.querySelectorAll('[data-view]').forEach(button=>button.onclick=()=>{model.cameraOrbit=button.dataset.view});
model.addEventListener('load',()=>document.querySelector('#status').textContent='Drag to rotate · Scroll to zoom');
model.addEventListener('error',()=>document.querySelector('#status').textContent='Model could not load. Serve this folder over HTTP and check your connection.');
document.querySelector('#motion').onclick=e=>{if(model.paused){model.play();e.target.textContent='Pause floating'}else{model.pause();e.target.textContent='Play floating'}};
</script></html>
